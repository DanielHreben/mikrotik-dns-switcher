services:
  mikrotik-dns-switcher:
    extends:
      file: docker-compose.yml
      service: mikrotik-dns-switcher
    networks:
      - nginx-proxy
    # `ports: []` would be merged with the base file's list, leaving 3000 published.
    ports: !reset [] # Remove direct port exposure (needs Docker Compose 2.24+)
    expose:
      - '3000'
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}

networks:
  nginx-proxy:
    external: true

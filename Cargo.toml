[package]
name = "mikrotik-dns-switcher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Daniel Hreben <daniel.hreben@gmail.com>"]
repository = "https://github.com/DanielHreben/mikrotik-dns-switcher"
description = "Per-device DNS switching through MikroTik DHCP leases"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
